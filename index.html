<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Clients</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
        }
        h1 { color: #00adb5; margin-bottom: 30px; }
        .category-section {
            background-color: #1e1e1e;
            border-radius: 8px;
            max-width: 500px;
            margin: 0 auto 25px auto;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 {
            border-bottom: 2px solid #393e46;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .prerelease h2 { color: #ff8c00; }
        .finished h2 { color: #4caf50; }
        .uncategorized h2 { color: #a0a0ab; }
        .game-btn {
            display: block;
            background-color: #393e46;
            color: white;
            padding: 12px;
            margin: 10px 0;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .game-btn:hover {
            background-color: #00adb5;
        }

        /* Fullscreen Image Overlay Container */
        #fullscreenContainer {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: black;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            cursor: pointer;
        }
        #fullscreenContainer img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <h1>Clients</h1>

    <div class="category-section prerelease">
        <h2>Prerelease Clients</h2>
        <a class="game-btn missing-b2e1" href="#">1.0.5rc1</a>
    </div>

    <div class="category-section finished">
        <h2>Finished Clients</h2>
        <a class="game-btn" href="Finish/ThirdPersonController/Third Person Controller.html">Third Person Controller</a>
    </div>

    <div class="category-section uncategorized">
        <h2>Not Categorized</h2>
        <a class="game-btn" href="https://calm-banoffee-df1e69.netlify.app/Beta1%20Rewrite3/index.html">Beta1 Rewrite3</a>
    </div>

    <div id="fullscreenContainer" onclick="exitFullscreenImage()">
        <img id="fullscreenImg" src="" alt="Error Graphic">
    </div>

    <script>
        const container = document.getElementById('fullscreenContainer');
        const fsImg = document.getElementById('fullscreenImg');

        document.querySelectorAll('.game-btn').forEach(button => {
            button.addEventListener('click', function(e) {
                // Only intercept if it's the explicitly missing build
                if (this.classList.contains('missing-b2e1')) {
                    e.preventDefault();
                    launchFullscreenImage("https://file.garden/ZywDpNV1JUxg3GpL/0x0000B2E1.bmp");
                }
                // Any other button (Third Person, Beta1) will act like a normal link and load its href
            });
        });

        function launchFullscreenImage(imgUrl) {
            fsImg.src = imgUrl;
            container.style.display = 'flex';

            if (container.requestFullscreen) {
                container.requestFullscreen();
            } else if (container.webkitRequestFullscreen) { /* Safari */
                container.webkitRequestFullscreen();
            } else if (container.msRequestFullscreen) { /* IE11 */
                container.msRequestFullscreen();
            }
        }

        function exitFullscreenImage() {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
            container.style.display = 'none';
            fsImg.src = "";
        }

        // Ensure container closes properly if user hits the Esc key instead of clicking
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                container.style.display = 'none';
                fsImg.src = "";
            }
        });
    </script>

</body>
</html>
