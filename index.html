<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Clients</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
        }
        h1 { color: #00adb5; margin-bottom: 30px; }
        .category-section {
            background-color: #1e1e1e;
            border-radius: 8px;
            max-width: 500px;
            margin: 0 auto 25px auto;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 {
            border-bottom: 2px solid #393e46;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .prerelease h2 { color: #ff8c00; }
        .finished h2 { color: #4caf50; }
        .uncategorized h2 { color: #a0a0ab; }
        .game-btn {
            display: block;
            background-color: #393e46;
            color: white;
            padding: 12px;
            margin: 10px 0;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .game-btn:hover {
            background-color: #00adb5;
        }
    </style>
</head>
<body>

    <h1>Clients</h1>

    <div class="category-section prerelease">
        <h2>Prerelease Clients</h2>
        <a class="game-btn client-b2e1" href="prerelease/1.0.5rc1/index.html">1.0.5rc1</a>
    </div>

    <div class="category-section finished">
        <h2>Finished Clients</h2>
        <a class="game-btn" href="Finish/ThirdPersonController/Third Person Controller.html">Third Person Controller</a>
    </div>

    <div class="category-section uncategorized">
        <h2>Not Categorized</h2>
        <a class="game-btn" href="https://calm-banoffee-df1e69.netlify.app/Beta1%20Rewrite3/index.html">Beta1 Rewrite3</a>
    </div>

    <script>
        document.querySelectorAll('.game-btn').forEach(button => {
            button.addEventListener('click', function(e) {
                e.preventDefault();
                const targetUrl = this.getAttribute('href');
                const isB2E1Client = this.classList.contains('client-b2e1');

                // Quick backend verification to see if the game files exist
                fetch(targetUrl, { method: 'HEAD' })
                .then(response => {
                    if (response.ok) {
                        // Success: Load the live game build!
                        window.location.href = targetUrl;
                    } else {
                        // 404 Error: Send to the designated File Garden image path
                        handleRedirect(isB2E1Client);
                    }
                })
                .catch(() => {
                    // Fail-safe network block trigger
                    handleRedirect(isB2E1Client);
                });
            });
        });

        function handleRedirect(isB2E1) {
            if (isB2E1) {
                // Instantly open the raw 0x0000B2E1 error graphic
                window.open("https://file.garden/ZywDpNV1JUxg3GpL/0x0000B2E1.bmp", "_blank");
            } else {
                // Instantly open the generic 404 placeholder graphic
                window.open("https://file.garden/ZywDpNV1JUxg3GpL/_(624)8.bmp", "_blank");
            }
        }
    </script>

</body>
</html>
